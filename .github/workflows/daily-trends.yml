name: AUREN AI Daily Trends
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: auren-daily-trends
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch genuine public trend RSS
        run: python scripts/collect_trends.py
      - name: Commit latest data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trending_searches.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: refresh US and MY search trends"
            git push
          fi
